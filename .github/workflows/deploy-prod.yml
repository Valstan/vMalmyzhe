name: Deploy to production

# Сборка едет в CI (ubuntu), т.к. прод-VPS (мало RAM) не тянет next build.
# На сервер по SSH кладём готовый standalone-артефакт и рестартим systemd-сервис.
#
# Требуется (значения — только в настройках репозитория, не в файлах: репо
# публичный, D-038 — реквизиты бокса в отслеживаемых файлах не держим):
#   secrets.SSH_PRIVATE_KEY        — приватная часть деплой-ключа
#   secrets.DEPLOY_SSH_HOST        — хост прод-сервера
#   vars.DEPLOY_SSH_PORT           — внешний SSH-порт (осознанно в vars: короткое
#                                    значение в secrets замазало бы весь лог, #223)
#   secrets.DEPLOY_SSH_USER        — пользователь деплоя на боксе (его $HOME — корень релизов)
#   vars.NEXT_PUBLIC_SERVER_URL    — боевой домен (punycode вмалмыже.рф; бейкается в бандл при сборке)
# Хост, пользователь и путь prod-env — в secrets, не в vars: значения vars
# раскрываются в публичном логе прогона, маскируются только secrets (письмо
# brain 29.08, pool #223). Логи публичного репо публичны.
# Секреты рантайма (DATABASE_URI, PAYLOAD_SECRET, …) в CI не нужны: сборка идёт на
# эфемерной БД с заглушками, на боксе их читает systemd из prod-env вне репо.

on:
  push:
    branches: [main]
    # docs/почта/markdown/инфра не трогают прод-артефакт — не гоняем пересборку+рестарт зря.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/**'
      - '.claude/**'
      - '.gitleaks.toml'
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vmalmyzhe_build
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      # Предохранитель миграций: `payload migrate` в CI зависает (drizzle push prompt)
      # и стандартный standalone-бандл не несёт payload CLI → Payload-миграции применяет
      # разработчик/brain ВРУЧНУЮ на проде (psql -f .sql + запись в payload_migrations)
      # ДО деплоя. CI лишь проверяет, что в коммите нет неприменённых миграций.
      # Ручной workflow_dispatch = «уже применил» → guard пропускается.
      - name: Migration guard
        if: github.event_name != 'workflow_dispatch'
        run: |
          set -e
          NEW=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'web/src/migrations/*.ts' | grep -v '/index\.ts$' || true)
          if [ -n "$NEW" ]; then
            echo "::error::Коммит вносит новые Payload-миграции. Примени их на проде вручную (psql -f web/src/migrations/<ts>.sql + INSERT в payload_migrations), затем запусти деплой через workflow_dispatch."
            echo "$NEW"
            exit 1
          fi
          echo "Новых Payload-миграций в коммите нет — деплой продолжается."

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Enable corepack + pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Generate importmap + types
        working-directory: web
        env:
          DATABASE_URI: postgresql://postgres:postgres@localhost:5432/vmalmyzhe_build
        run: |
          pnpm generate:importmap
          pnpm generate:types

      - name: Build (standalone)
        working-directory: web
        env:
          # Эфемерная БД CI: push:true создаёт схему здесь, prerender отдаёт пустые
          # страницы (контента в CI нет) — рантайм наполнит через ISR/ревалидацию.
          DATABASE_URI: postgresql://postgres:postgres@localhost:5432/vmalmyzhe_build
          PAYLOAD_SECRET: ci-build-only-secret-not-used-at-runtime
          NEXT_PUBLIC_SERVER_URL: ${{ vars.NEXT_PUBLIC_SERVER_URL || 'http://127.0.0.1:3004' }}
          # Включает output:'standalone' (next.config.js).
          STANDALONE_BUILD: '1'
        run: pnpm build

      - name: Assemble standalone bundle
        working-directory: web
        run: |
          set -e
          if [ ! -f .next/standalone/server.js ]; then
            echo "::error::server.js не в корне .next/standalone — проверь outputFileTracingRoot"
            find .next/standalone -maxdepth 3 -name server.js || true
            exit 1
          fi
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi
          tar czf ../vmalmyzhe-app.tgz -C .next/standalone .
          echo "bundle: $(du -h ../vmalmyzhe-app.tgz | cut -f1)"

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -e
          if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$DEPLOY_SSH_HOST" ] || [ -z "$DEPLOY_SSH_PORT" ] || [ -z "$DEPLOY_SSH_USER" ]; then
            echo "::error::Заданы не все: secrets.SSH_PRIVATE_KEY / secrets.DEPLOY_SSH_HOST / vars.DEPLOY_SSH_PORT / secrets.DEPLOY_SSH_USER"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519_vmalmyzhe
          chmod 600 ~/.ssh/id_ed25519_vmalmyzhe
          ssh-keyscan -p "$DEPLOY_SSH_PORT" -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat > ~/.ssh/config <<CFG
          Host vmalmyzhe
            HostName $DEPLOY_SSH_HOST
            Port $DEPLOY_SSH_PORT
            User $DEPLOY_SSH_USER
            IdentityFile ~/.ssh/id_ed25519_vmalmyzhe
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
          CFG
          chmod 600 ~/.ssh/config

      - name: Ship artifact + restart
        run: |
          set -e
          scp -q vmalmyzhe-app.tgz vmalmyzhe:/tmp/vmalmyzhe-app.tgz
          ssh vmalmyzhe 'bash -s' "${{ github.sha }}" <<'REMOTE'
          set -e
          SHA="$1"
          # Корень релизов — в $HOME пользователя деплоя (heredoc закавычен,
          # $HOME раскрывается на боксе). Абсолютный путь в репо не держим (D-038).
          BASE="$HOME/vmalmyzhe"
          REL="$BASE/releases/$SHA"
          rm -rf "$REL"; mkdir -p "$REL"
          tar xzf /tmp/vmalmyzhe-app.tgz -C "$REL"
          rm -f /tmp/vmalmyzhe-app.tgz
          # Персистентное медиа: staticDir = <release>/public/media лежит внутри
          # релиз-директории, которую деплой пересоздаёт. Подменяем на симлинк в
          # общий каталог $BASE/shared/media, переживающий релизы. На проде также
          # MEDIA_DIR в prod-env может указывать сюда же.
          mkdir -p "$BASE/shared/media"
          rm -rf "$REL/public/media"
          ln -sfn "$BASE/shared/media" "$REL/public/media"
          ln -sfn "$REL" "$BASE/current"
          sudo systemctl restart vmalmyzhe
          # держим последние 5 релизов
          ls -1dt "$BASE"/releases/*/ 2>/dev/null | tail -n +6 | xargs -r rm -rf
          echo "deployed $SHA"
          REMOTE

      # ADR-0006: копия своих секретов — в свою комнату КАРМАНа. Делается С БОКСА,
      # а не с раннера: наши рантайм-секреты живут только в prod-env и в GitHub
      # Secrets их нет (#008) — значит, зеркалить с раннера попросту нечего, и
      # образец Сабантуя (паспорт + значения из secrets) к нашей форме не подходит.
      # Токен комнаты уже лежит на боксе, значения из него не выходят.
      #
      # Allowlist осознанный, а не «всё из prod-env»: зеркалим то, чей ПОВТОРНЫЙ
      # выпуск стоит чужого труда или сломает чужую сторону. DATABASE_URI намеренно
      # НЕ зеркалим — пароль привязан к постгресу на этом же боксе, вместе с боксом
      # теряется и база, так что для восстановления строка бесполезна, а как
      # содержимое комнаты — самая лакомая строка файла.
      #
      # Шаг не блокирующий: отказ зеркала не должен ронять деплой. Проверка —
      # эхо приёмника (#110), а не «шаг зелёный»: после записи читаем ключ обратно
      # и сверяем первые символы sha256. Значения в лог не попадают.
      - name: Зеркалировать свои секреты в комнату vault
        if: success()
        continue-on-error: true
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          set -eo pipefail
          ssh vmalmyzhe 'bash -s' "$PROD_ENV_FILE" <<'REMOTE'
          set -eo pipefail
          ENV_FILE="$1"
          command -v jq >/dev/null || { echo "::warning::jq на боксе нет — зеркалирование пропущено"; exit 0; }

          # ⚠️ Отсутствующее имя — норма (не все ключи заведены), поэтому неудачный
          # grep гасится здесь. Без этого `set -eo pipefail` убивает весь скрипт на
          # первом же отсутствующем ключе — и шаг падает молча, ничего не напечатав
          # (поймано живым прогоном 03.09, run 33774054942).
          val() {
            local out
            out=$(sudo -n grep "^$1=" "$ENV_FILE" 2>/dev/null | head -1) || out=""
            printf '%s' "${out#*=}" | sed 's/^"\(.*\)"$/\1/'
          }
          TOKEN=$(val SECRETS_TOKEN); VAULT=$(val SECRETS_VAULT_URL)
          [ -n "$TOKEN" ] && [ -n "$VAULT" ] || { echo "::warning::SECRETS_TOKEN/SECRETS_VAULT_URL в prod-env нет — зеркалирование пропущено"; exit 0; }
          VAULT="${VAULT%/}"; case "$VAULT" in */api/secrets) ;; *) VAULT="$VAULT/api/secrets" ;; esac

          # Якорь: новый СВОЙ секрет в .env.example → добавить и сюда.
          NAMES="PAYLOAD_SECRET GATEWAY_KEY_VMALMYZHE INGEST_PUBLISH_KEY SARAFAN_GATEWAY_KEY"
          umask 077; TMP=$(mktemp); trap 'rm -f "$TMP"' EXIT
          # Пары «имя<TAB>значение» на stdin jq — без eval и без подстановки в
          # строку: значение с пробелом, кавычкой или $ ничего не ломает и в
          # командную строку (а значит, в `ps`) не попадает. Перевод строки в
          # значении невозможен: EnvironmentFile его не разбирает.
          n=0
          for NAME in $NAMES; do
            V=$(val "$NAME"); [ -n "$V" ] || { echo "$NAME: нет в prod-env, пропущен"; continue; }
            printf '%s\t%s\n' "$NAME" "$V"; n=$((n+1))
          done > "$TMP.pairs"
          [ "$n" -gt 0 ] || { echo "::warning::зеркалить нечего"; exit 0; }
          jq -R -s '{secrets: (split("\n") | map(select(length > 0)) | map(split("\t"))
                     | map({(.[0]): (.[1:] | join("\t"))}) | add)}' < "$TMP.pairs" > "$TMP"
          rm -f "$TMP.pairs"

          curl -sf -X POST "$VAULT" -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' --data @"$TMP" > /dev/null \
            || { echo "::warning::комната не приняла запись"; exit 0; }

          # Эхо приёмника: читаем обратно и сверяем отпечаток, не значение.
          for NAME in $NAMES; do
            V=$(val "$NAME"); [ -n "$V" ] || continue
            MINE=$(printf '%s' "$V" | sha256sum | cut -c1-12)
            THEIRS=$(curl -sf --max-time 15 -H "Authorization: Bearer $TOKEN" "$VAULT?key=$NAME" \
              | jq -r --arg n "$NAME" '.secrets[$n] // empty' | tr -d '\n' | sha256sum | cut -c1-12)
            [ "$MINE" = "$THEIRS" ] && echo "$NAME: эхо совпало ($MINE)" || echo "::warning::$NAME: эхо НЕ совпало ($MINE vs $THEIRS)"
          done
          REMOTE

      - name: Smoke check — local routes (/, /news, /admin)
        run: |
          set -e
          ssh vmalmyzhe 'bash -s' <<'REMOTE'
          set -e
          sleep 6   # дать сервису подняться после systemctl restart
          fail=0
          check() {
            path="$1"; expected="$2"
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "http://127.0.0.1:3004$path" || true)
            echo "local $path → $status (ожидалось: $expected)"
            case " $expected " in
              *" $status "*) ;;
              *) echo "::error::local $path = $status, ожидалось одно из: $expected"; fail=1 ;;
            esac
          }
          check "/"      "200"
          check "/news"  "200"
          # /admin без сессии отдаёт экран входа (200) или редирект — главное, не 5xx/000.
          check "/admin" "200 302 307 308"
          exit $fail
          REMOTE

      # Урезанная диагностика вместо `systemctl status` + `journalctl`: маска
      # secrets закрывает только точное значение целиком, а `status` печатает
      # путь юнита, journalctl — короткий хостнейм в каждой строке, ошибка БД —
      # DATABASE_URI (письмо brain 01.09, #265, G290). Печатаем всегда, не только
      # при падении: так приёмка редакции идёт по настоящему выводу (#262).
      - name: Service state + журнал (урезанный, с редакцией)
        if: always()
        run: |
          ssh vmalmyzhe 'bash -s' <<'REMOTE' 2>&1 || true
          H="$(hostname -s)"; F="$(hostname -f 2>/dev/null || true)"
          sudo systemctl show vmalmyzhe -p ActiveState -p SubState -p Result -p ExecMainStatus -p NRestarts
          sudo journalctl -u vmalmyzhe -n 60 --no-pager -o cat \
            | sed -E "s#([a-z]+://)[^/@[:space:]]+@#\1***:***@#g" \
            | sed -E "s#/home/[^/[:space:]]+#/home/[user]#g" \
            | { if [ -n "$F" ]; then sed "s#$F#[host]#g"; else cat; fi; } \
            | sed "s#$H#[host]#g"
          REMOTE
