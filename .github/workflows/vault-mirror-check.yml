name: Vault mirror check (passport)

# Проверка паспортного зеркала: положить наши секреты в свою комнату vault по
# удостоверению прогона (ADR-0012, форма Б) и СВЕРИТЬ эхо приёмника.
#
# Зачем отдельный workflow, если зеркало уже есть в деплое:
#   • доказать, что паспортный путь работает, ДО того как комнатный токен на
#     боксе станет read-only (канон: «на бокс кладём только read-only; пишущий
#     не кладём»). Порядок владельца: сначала паспортное зеркало, потом
#     замена токена;
#   • после замены токена — проверить, что DR-копия в комнате жива и что
#     запись по-прежнему идёт (пишущий токен боксу больше не нужен);
#   • прогон вручную: прод не перезапускается, значения не меняются (шаг
#     перезаписывает те же самые), приёмка — эхо по каждому ключу.
#
# Значения секретов в лог не попадают: с бокса они едут файлом 0600, тело
# запроса — файлом, токен маскируется до первого использования, сессия гасится
# в trap.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -e
          if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$DEPLOY_SSH_HOST" ] || [ -z "$DEPLOY_SSH_PORT" ] || [ -z "$DEPLOY_SSH_USER" ]; then
            echo "::error::Заданы не все: secrets.SSH_PRIVATE_KEY / secrets.DEPLOY_SSH_HOST / vars.DEPLOY_SSH_PORT / secrets.DEPLOY_SSH_USER"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519_vmalmyzhe
          chmod 600 ~/.ssh/id_ed25519_vmalmyzhe
          ssh-keyscan -p "$DEPLOY_SSH_PORT" -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat > ~/.ssh/config <<CFG
          Host vmalmyzhe
            HostName $DEPLOY_SSH_HOST
            Port $DEPLOY_SSH_PORT
            User $DEPLOY_SSH_USER
            IdentityFile ~/.ssh/id_ed25519_vmalmyzhe
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
          CFG
          chmod 600 ~/.ssh/config

      - name: Зеркало по паспорту + эхо приёмника
        env:
          VAULT_BASE: https://${{ secrets.DEPLOY_SSH_HOST }}
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
          DEPLOY_HOST: vmalmyzhe
        run: |
          set -euo pipefail
          bash .github/scripts/vault-mirror.sh
