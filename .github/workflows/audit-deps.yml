name: Audit deps

# Аудит зависимостей по расписанию, а не только когда кто-то открыл PR (#312,
# дайджест brain 12.09: у КАРМАНа два critical RCE в `next` жили на проде
# между PR, потому что гейт говорит только в PR). Первый прогон 12.09 —
# красный по факту: 4 critical (payload < 3.79.1 pre-auth account takeover,
# next < 15.5.24 RCE) — это и есть показанный красный (#104).
#
# Только прод-зависимости (`--prod`): dev-цепочка eslint/vitest/knip на прод
# не едет, её шум прятал бы настоящее. Порог — high: moderate и ниже не роняют.
# Красный прогон — не гейт мержа (workflow отдельный), а сигнал: письмо в
# Actions → обновить и закрыть отдельным PR.

on:
  schedule:
    - cron: '17 5 * * 1,4'   # пн и чт 05:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - 'web/package.json'
      - 'web/pnpm-lock.yaml'
      - '.github/workflows/audit-deps.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    # issues: write — шагу «Открыть issue при красном аудите» нужно право создать
    # issue. На уровне шага `permissions` не поддерживается (GitHub отвергает файл:
    # «Unexpected value 'permissions'»), поэтому право даётся job'у целиком.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Enable corepack + pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      # Установка не нужна: audit читает lockfile. Без install шаг быстрее и не
      # зависит от postinstall-скриптов.
      - name: pnpm audit (prod, high+)
        working-directory: web
        shell: bash
        run: |
          set -o pipefail
          pnpm audit --prod --audit-level=high 2>&1 | tee audit.txt
          rc=${PIPESTATUS[0]}
          echo "## pnpm audit --prod --audit-level=high" >> "$GITHUB_STEP_SUMMARY"
          tail -n 3 audit.txt >> "$GITHUB_STEP_SUMMARY"
          [ "$rc" = 0 ] || echo "::error::в прод-зависимостях есть уязвимости уровня high/critical — обновить отдельным PR"
          exit "$rc"

      # Грабля G547: «проверка по расписанию» = «кто-то узнаёт о провале».
      # Реальный случай: плановая проверка была красной с 29.10 по 01.11 (run
      # 40865922015) — 2 critical + 8 high в прод-зависимостях, и никто об этом
      # не узнал, пока прогоны не посмотрели глазами. Расписание без адресата
      # охраняет не файлы, а квоту: тратит прогоны и молчит.
      #
      # Поэтому красный порождает внешний след — issue в своём репо (директива
      # владельца от 05.11). В issue идут ФАКТЫ (что именно красное: пакет,
      # версия, severity, advisory), а не «проверка упала».
      #
      # Только для запусков не из PR: у провала на PR адресат есть — сам PR.
      # Issue открывается там, где адресата не было, — на расписании.
      - name: Открыть issue при красном аудите
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -uo pipefail
          cd web

          # Факты — из вывода того же аудита, который уже лёг в audit.txt.
          # Разбор не нужен: сам вывод pnpm — это перечень уязвимых пакет.
          sed -r 's/\x1B\[[0-9;]*[mK]//g' audit.txt > audit.clean.txt || true

          {
            echo "Красный аудит прод-зависимостей (\`pnpm audit --prod --audit-level=high\`)."
            echo
            echo "- Прогон: ${RUN_URL}"
            echo "- Коммит: \`${COMMIT_SHA}\`"
            echo "- Дата: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Сработало по расписанию, адресата у провала не было."
            echo
            echo "## Что именно красное"
            echo
            echo '```text'
            cat audit.clean.txt
            echo '```'
            echo
            echo "Лечение — отдельным PR: обновить пакет до исправленной версии."
            echo "Порог гейта — \`high\`; moderate и ниже не роняют."
          } > issue-body.md

          # Дедупликация: один открытый issue на класс проблемы, дальше — комментарии.
          # Иначе расписание (пн и чт) засыпает репо issue'ами.
          LABEL=audit-deps
          gh label create "$LABEL" --color B60205 \
            --description "Красный аудит прод-зависимостей (high+)" --force

          EXISTING=$(gh issue list --label "$LABEL" --state open --limit 1 \
            --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file issue-body.md
            echo "::notice::Красный аудит — комментарий в issue #$EXISTING"
          else
            gh issue create --label "$LABEL" \
              --title "Красный аудит прод-зависимостей — run ${GITHUB_RUN_NUMBER}" \
              --body-file issue-body.md
          fi
