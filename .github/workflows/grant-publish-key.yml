name: Grant publish key to Sarafan

# Выдача Сарафану права ПУБЛИКОВАТЬ (не только доставлять) — решение
# владельца 2026-09-12: 379 черновиков конвейера месяц никто не публиковал,
# классификатор на глаз попадал в рубрику, пусть публикует сам.
#
# Механика — двусторонний grant КАРМАНа (D-061): мы предлагаем СВОЙ ключ
# INGEST_PUBLISH_KEY из своей комнаты, Сарафан принимает своим токеном по
# allowlist имён (scripts/accept_secret_grants.py у него). До принятия имя у
# получателя не занято, значение он не видит.
#
# Имя у получателя — VMALMYZHE_PUBLISH_KEY: конвенция <SITE>_INGEST_KEY,
# которую задал КАРМАН, продолжена для второго ключа этого сайта.
#
# Право берёмся по паспорту (ADR-0012): `POST /api/secrets/grants` требует
# права записи, а комнатный токен на боксе по канону остаётся read-only.
# Сессия открывается по удостоверению прогона и гасится сама.
#
# Запуск кнопкой, повторный запуск безопасен: 409 «уже принято» — не ошибка,
# а состояние. Значений ключей и токена шаг не печатает.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'propose — предложить grant; status — только показать выданное/полученное; revoke — отозвать по id'
        required: true
        default: 'status'
        type: choice
        options: [status, propose, revoke]
      grant_id:
        description: 'id выдачи для revoke'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  grant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Выдача (по паспорту, без значений)
        env:
          VAULT_BASE: https://${{ secrets.DEPLOY_SSH_HOST }}
          MODE: ${{ inputs.mode }}
          KEY: INGEST_PUBLISH_KEY
          ALIAS: VMALMYZHE_PUBLISH_KEY
          TARGET: setka
          NOTE: 'решение владельца 2026-09-12: автопубликация конвейера; письмо vMalmyzhe→brain 2026-09-12-publish-key'
          GRANT_ID: ${{ inputs.grant_id }}
        run: |
          set -euo pipefail
          bash .github/scripts/vault-grant.sh
