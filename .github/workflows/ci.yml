name: CI

# Гейты на PR. Заведено 2026-08-03 по ревизии #104.
#
# До этого автоматических проверок на PR не было вовсе: lint и typecheck гонял
# вручную агент на своей машине, а единственная машинная проверка (`next build`)
# стояла в деплое — то есть УЖЕ ПОСЛЕ мержа в main, когда изменение едет на прод.
# «Гейты зелёные» означало «агент вспомнил их запустить». Забыл — никто не узнал.
#
# Красный прогон каждого гейта показан вживую (приёмочный критерий #104):
#   test      — вернули баг «publish не проставляет _status» → exit 1
#   typecheck — присвоили строку в number                    → exit 2
#   lint      — нарушили rules-of-hooks                      → exit 1
#   lint      — нарочно внесли `any` после поднятия правил в error → exit 1
#   deadcode  — нарочно внесли unused-export (__probe)       → exit 1
#   secrets   — подсадной случайный токен в одноразовой ветке → exit 1,
#               значение в логе не печатается (--redact); см. .gitleaks.toml
#
# build здесь намеренно НЕ гоняем: Payload лезет в БД на пререндере, поднимать
# Postgres в CI ради этого дороже пользы — сборка проверяется в deploy-prod.yml.
#
# Сканер секретов живёт ШАГОМ внутри `gates`, а не отдельным workflow: `gates` —
# обязательная проверка в защите ветки (с 2026-08-17), значит красный сканер
# блокирует мерж на сервере без отдельной настройки required checks.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Полная история: без неё сканер видит один коммит и зелен ровно в том
          # сценарии, ради которого ставится (секрет во втором коммите PR).
          fetch-depth: 0

      # Сканер секретов — мандат brain 2026-08-17 (репо публичный, D-030).
      # Действие само передаёт --redact и --exit-code=2 → job красный на находке.
      # Правила: дефолт gitleaks + свои (VK/Telegram/наши env-имена/postgres-URI)
      # из .gitleaks.toml в корне — gitleaks подхватывает его автоматически.
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"   # токен read-only, комментарии в PR не нужны — есть summary

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Enable corepack + pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: web
        run: pnpm lint

      - name: Typecheck
        working-directory: web
        run: pnpm typecheck

      - name: Tests
        working-directory: web
        run: pnpm test

      # Судьба knip решена (ревизия #104): включаем в CI как гейт «мёртвый код»,
      # а не держим скрипт который никто не вызывает. Красный прогон показан:
      # нарочный unused-export падает с exit 1, откачено.
      - name: Dead code
        working-directory: web
        run: pnpm deadcode
