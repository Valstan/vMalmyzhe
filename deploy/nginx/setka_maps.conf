# Карта схемы для vhost'а ЕСА.
#
# TLS для вход.вмалмыже.рф терминирует edge (Джино), поэтому до бокса запрос
# приходит по http, а «настоящая» схема живёт в заголовке X-Forwarded-Proto.
# Без этой карты $scheme на боксе всегда http — и приложение, которое
# поверит ему, отдало бы посетителю http-адрес (сессионная cookie с флагом
# Secure по http не поедет — вход просто молча не работает; это уже
# случалось на .рф-поддоменах 02.08).
#
# Правило: верим заголовку edge'а, если он есть; иначе $scheme.
#
# Установка:
#   sudo cp deploy/nginx/setka_maps.conf /etc/nginx/conf.d/setka_maps.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Карта должна жить в http-контексте (в conf.d это уровень http) — иначе
# nginx не поднимется с «unknown variable».

map $http_x_forwarded_proto $setka_esa_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
