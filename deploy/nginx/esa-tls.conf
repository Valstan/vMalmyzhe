# Вход.вмалмыже.рф — TLS-блок на боксе портала.
#
# СХЕМА (проверено 28.11 на живом входе): TLS терминирует САМ БОКС (nginx +
# certbot), edge Джино пробрасывает SNI как есть — посетитель видит сертификат
# бокса, а не edge'а. Этот файл и есть тот vhost, который обслуживает HTTPS.
# HTTP-часть — в esa.conf (тот же бокс, порт 80).
#
# Порядок (иначе nginx не поднимется — файлов сертификата ещё нет):
#   1) sudo cp deploy/nginx/esa.conf /etc/nginx/sites-enabled/esa
#      sudo cp deploy/nginx/setka_maps.conf /etc/nginx/conf.d/setka_maps.conf
#      sudo nginx -t && sudo systemctl reload nginx
#   2) выпуск сертификата на боксе (проверка ACME идёт через edge → бокс →
#      location /.well-known/acme-challenge/ в esa.conf):
#      sudo mkdir -p /var/www/html/.well-known/acme-challenge
#      sudo certbot certonly --webroot -w /var/www/html \
#        -d xn--b1ae3a1a.xn--80adkdyec4j.xn--p1ai --non-interactive --agree-tos
#   3) sudo cp deploy/nginx/esa-tls.conf /etc/nginx/sites-enabled/esa-tls
#      sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ У www-поддомена (www.вход.вмалмыже.рф) проверка ACME не проходит: edge
# его не маршрутизирует на бокс. Сертификат выпускается только на основной домен.
#
# После выпуска — хук на перезагрузку nginx (webroot сам nginx не перезагружает):
#   sudo install -m 755 deploy/certbot-reload-nginx.sh \
#     /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name xn--b1ae3a1a.xn--80adkdyec4j.xn--p1ai;

    ssl_certificate /etc/letsencrypt/live/xn--b1ae3a1a.xn--80adkdyec4j.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--b1ae3a1a.xn--80adkdyec4j.xn--p1ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;

    location /internal/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $setka_esa_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
