# Вход.вмалмыже.рф — TLS-блок для случая, когда домен переведён DNS'ом
# ПРЯМО на бокс портала (без edge).
#
# Нужен только в этом случае: пока домен ведёт на edge (Джино), тот держит
# сертификат и терминирует TLS сам, а бокс обслуживает домен по http
# (deploy/nginx/esa.conf). Оба файла ставятся рядом и не конфликтуют: блоки
# живут на разных портах.
#
# Порядок (иначе nginx не поднимется — файлов сертификата ещё нет):
#   1) sudo cp deploy/nginx/esa.conf /etc/nginx/sites-enabled/esa
#      sudo cp deploy/nginx/setka_maps.conf /etc/nginx/conf.d/setka_maps.conf
#      sudo nginx -t && sudo systemctl reload nginx
#   2) выпуск сертификата (домен уже должен указывать на бокс):
#      sudo certbot certonly --nginx -d xn--b1ae3a1a.xn--80adkdyec4j.xn--p1ai
#   3) sudo cp deploy/nginx/esa-tls.conf /etc/nginx/sites-enabled/esa-tls
#      sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name xn--b1ae3a1a.xn--80adkdyec4j.xn--p1ai;

    ssl_certificate /etc/letsencrypt/live/xn--b1ae3a1a.xn--80adkdyec4j.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--b1ae3a1a.xn--80adkdyec4j.xn--p1ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;

    location /internal/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $setka_esa_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
