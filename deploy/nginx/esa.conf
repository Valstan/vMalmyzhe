# Вход.вмалмыже.рф — ЕСА: HTTP-часть vhost'а на боксе портала.
#
# СХЕМА (проверено 28.11 на живом входе): TLS для этого домена терминирует
# САМ БОКС (nginx + certbot), а edge Джино пробрасывает SNI как есть. Видно
# по сертификату, который видит посетитель: он выпущен на боксу
# (/etc/letsencrypt/live/xn--b1ae3a1a.../fullchain.pem), а не на edge.
# Поэтому этот HTTP-vhost нужен для (а) запросов, которые edge передаёт по
# http, и (б) проверки ACME при выпуске и продлении сертификата.
# TLS-часть — в esa-tls.conf (тот же бокс, порт 443).
#
# Почему домен переехал именно сюда: ЕСА вынесена из Сарафана в отдельный
# сервис (esa/) и живёт на боксе портала; адрес issuer'а не изменился, чтобы
# соседние проекты (Тренер, Сабантуй, Казанская, ПОЗВОНИ, КАРМАН) не требовали
# перерегистрации клиентов.
#
# Установка (на боксе, из-под пользователя деплоя):
#   sudo cp deploy/nginx/esa.conf /etc/nginx/sites-enabled/esa
#   sudo cp deploy/nginx/setka_maps.conf /etc/nginx/conf.d/setka_maps.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Чего этот vhost НЕ делает:
#   * не отдаёт /internal/* — внутренний API ЕСА живёт только между порталом и
#     сервисом на этом же боксе (сам сервис дополнительно требует общий токен);
#   * не трогает vhost портала: /login и /services на вмалмыже.рф — страницы
#     Next.js, они живут в vhost'е портала.
#
# Punycode в URL — символ в символ (G108): вход.вмалмыже.рф =
# xn--b1ae3a1a.xn--80adkdyec4j.xn--p1ai.

server {
    listen 80;
    listen [::]:80;
    server_name xn--b1ae3a1a.xn--80adkdyec4j.xn--p1ai;

    # ACME-вызов: certbot (плагин webroot) кладёт проверку сюда, и edge
    # отдаёт её боксу по http. Путь должен существовать на боксе:
    #   sudo mkdir -p /var/www/html/.well-known/acme-challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Внутренний API — только портал на этом же боксе. Наружу не отдаём:
    # 404, а не 403 (маршрута для внешнего мира не существует).
    location /internal/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Ровно IP посетителя, БЕЗ $proxy_add_x_forwarded_for: приложение берёт
        # ПЕРВЫЙ элемент X-Forwarded-For, а цепочка edge'ов склеила бы всех
        # посетителей домена в одного клиента (лимит входа на всех).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $setka_esa_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
