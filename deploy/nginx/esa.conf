# Вход.вмалмыже.рф — ЕСА: OIDC-провайдер экосистемы, страница входа и каталог
# сервисов. Перенесено с бокса Сарафана на бокс портала (вмалмыже.рф).
#
# Установка (на боксе, из-под пользователя деплоя):
#   sudo cp deploy/nginx/esa.conf /etc/nginx/sites-enabled/esa
#   sudo nginx -t && sudo systemctl reload nginx
#
# Почему только :80, без TLS:
#   Сертификат для вход.вмалмыже.рф держит edge (Джино) — он же терминирует
#   TLS для этого домена и передаёт запрос на бокс по http. Пока edge ведёт
#   домен на бокс Сарафана, блок ssl_certificate на боксе портала не нужен и
#   только мешал бы: nginx не поднимется, если файлов сертификата нет.
#   Если владелец переключит DNS домена прямо на бокс (без edge) — добавляется
#   deploy/nginx/esa-tls.conf, а сертификат выпускается certbot на боксе
#   (путь ACME уже прописан в этом файле).
#
# Чего этот vhost НЕ делает:
#   * не отдаёт /internal/* — внутренний API ЕСА живёт только между порталом и
#     сервисом на этом же боксе (сам сервис дополнительно требует общий токен);
#   * не трогает vhost портала: /login и /services на вмалмыже.рф — страницы
#     Next.js, они живут в vhost'е портала.
#
# Punycode в URL — символ в символ (G108): вход.вмалмыже.рф =
# xn--b1ae3a1a.xn--80adkdyec4j.xn--p1ai.

server {
    listen 80;
    listen [::]:80;
    server_name xn--b1ae3a1a.xn--80adkdyec4j.xn--p1ai;

    # ACME-вызов: если домен переведут прямо на бокс, certbot (плагин nginx)
    # отдаст проверку отсюда. Пока edge терминирует TLS, путь не трогаем.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Внутренний API — только портал на этом же боксе. Наружу не отдаём:
    # 404, а не 403 (маршрута для внешнего мира не существует).
    location /internal/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Ровно IP посетителя, БЕЗ $proxy_add_x_forwarded_for: приложение берёт
        # ПЕРВЫЙ элемент X-Forwarded-For, а цепочка edge'ов склеила бы всех
        # посетителей домена в одного клиента (лимит входа на всех).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $setka_esa_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
