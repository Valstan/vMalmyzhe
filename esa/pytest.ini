[pytest]
# Тесты лежат рядом с сервисом: pythonpath добавляет корень esa/ в sys.path,
# поэтому тесты видят пакет app без установки пакета в окружение.
pythonpath = .

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

addopts =
    -q
    --strict-markers
    --tb=short

markers =
    slow: долгие тесты
    unit:单元ные тесты

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

minversion = 7.0
